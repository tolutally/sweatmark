name: sweatmark
description: A high-fidelity fitness application.
publish_to: 'none'
version: 1.4.1+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  phosphor_icons: ^3.0.1
  shared_preferences: ^2.2.2

  cupertino_icons: ^1.0.2
  path_provider: ^2.0.0
  share_plus: ^11.1.0
  intl: ^0.20.2
  table_calendar: ^3.0.9
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  
  # Image caching for ExerciseDB GIFs
  cached_network_image: ^3.3.1
  
  # Social Sign-In
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  crypto: ^3.0.3
  
  # Local Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  
  
  
  # Charts for Analytics
  fl_chart: ^0.70.0
  health: ^13.3.1

dev_dependencies:
  firebase_core_platform_interface: ^6.0.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icon-foreground.png
    - assets/exercises/catalog_v1.json
    - assets/exercises/media/
    - assets/onboarding/
    - assets/brand/
    - assets/fonts/general_sans/LICENSE.txt
  fonts:
    - family: General Sans
      fonts:
        - asset: assets/fonts/general_sans/GeneralSans-Regular.otf
          weight: 400
        - asset: assets/fonts/general_sans/GeneralSans-Medium.otf
          weight: 500
        - asset: assets/fonts/general_sans/GeneralSans-Semibold.otf
          weight: 600
        - asset: assets/fonts/general_sans/GeneralSans-Bold.otf
          weight: 700
        - asset: assets/fonts/general_sans/GeneralSans-Italic.otf
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

  # Android adaptive icon
  adaptive_icon_background: "#1D1C21"  # Ink background
  adaptive_icon_foreground: "assets/icon-foreground.png"

  min_sdk_android: 21

  ios_icon: true
  remove_alpha_ios: true
